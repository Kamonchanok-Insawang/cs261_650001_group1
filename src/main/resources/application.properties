spring.application.name=demo
# ชี้ไปยัง container ชื่อ 'db' ที่เราจะสร้างใน docker-compose
spring.datasource.url=jdbc:mysql://db:3306/appdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ตั้งค่าให้สร้างตารางอัตโนมัติ
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect