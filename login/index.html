<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TU Review - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="logo-box">
      <div class="logo-tu">TU</div>
      <div class="logo-sub">Review</div>
    </div>
    <form id="loginForm" class="login-form" novalidate>
  <div class="input-group">
    <i class="fa-regular fa-user input-icon"></i>
    <input type="text" id="username" placeholder="username" autocomplete="username" required>
  </div>

  <div class="input-group">
    <i class="fa-solid fa-lock input-icon"></i>
    <input type="password" id="password" placeholder="password" autocomplete="current-password" required>
    <button type="button" id="togglePassword" class="toggle-password" aria-label="Toggle password">
      <i class="fa-regular fa-eye-slash" id="eyeIcon"></i>
    </button>
  </div>

  <button type="submit" id="submitBtn" class="btn-submit">
    <span>LOGIN</span>
  </button>

  <div class="form-footer">
    <a href="#" id="forgotBtn" class="forgot-link">Forget Password?</a>
  </div>
</form>
  </div>
  <script src="script.js"></script>
</body>
</html>
