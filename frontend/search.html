<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TU REVIEW - Search Courses</title>
  

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="search.css">
</head>
<body>

  <div class="app-container">
    <header class="main-header">
      <div class="brand">
        <h1 class="brand-title">TU REVIEW</h1>
        <p class="brand-sub">course reviews for better learning</p>
      </div>
      <div class="user-badge" id="userProfileBtn">
        <div class="user-avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <span class="user-name">User Account</span>
      </div>
    </header>

    <div class="search-section">
      <div class="search-input-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="course code">
      </div>
      <button type="button" id="openFilterBtn" class="filter-btn" aria-label="Open filter">
        <i class="fa-solid fa-sliders"></i>
      </button>
    </div>
  </div>
  <script src="search.js"></script>
</body>
</html>
